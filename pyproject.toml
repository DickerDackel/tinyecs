[project]
name = "tinyecs"
description = "The teeniest, tiniest ECS system"
version = "0.5.0"
readme = "README.rst"

authors = [
    { name="Michael Lamertz", email="michael.lamertz@gmail.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: pygame",
]

license = "MIT"
license-files = ["LICENSE"]

dependencies = [ ]

[project.optional-dependencies]
base = ["tinyecs-compsys-base"]
dynamics = ["tinyecs-compsys-dynamics"]
patternengine = ["tinyecs-compsys-patternengine"]
sdl2 = ["tinyecs-compsys-sdl2"]
demos = [
    "tinyecs[base,dynamics,sdl2]",
    "tinyecs-demo",
]
all = ["tinyecs[base,dynamics,sdl2,patternengine,demos]"]

[project.urls]
homepage = "https://github.com/dickerdackel/tinyecs"
bugtracker = "https://github.com/DickerDackel/tinyecs/issues"
docs = "https://tinyecs.readthedocs.io/"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
addopts = "-rA -s"
testpaths = [
    "tests",
]

[tool.basedpyright]
reportAny = false
reportExplicitAny = false
